*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:DS,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;font-feature-settings:"tnum" 0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{flex:none}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:252px;flex:none;background:var(--surf);border-right:1px solid var(--line);padding:22px 14px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:12px;padding:2px 10px 18px}
.logo i{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--accd));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -8px var(--acc)}
.logo i svg{width:22px;height:22px}
.logo b{display:block;font-weight:800;font-size:20px;letter-spacing:-.03em;line-height:1.1}
.logo small{display:block;font-size:10.5px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);margin:1px 0}
.nav a svg{width:19px;height:19px}
.nav a:hover{background:var(--surf2);color:var(--ink)}
.nav a.on{background:var(--soft);color:var(--acc)}
.nav a.on svg{stroke-width:2.2}
.nav .sep{font-size:10.5px;letter-spacing:.2em;font-weight:800;color:var(--muted);padding:14px 12px 5px;opacity:.75}
.side .foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--muted)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 32px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px)}
.top .crumb{flex:1;min-width:0;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb b{color:var(--ink)}
.saved{font-size:12px;color:var(--muted)}
.content{padding:6px 32px 64px;max-width:1280px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
.ph h1,.h-xl{font-weight:800;font-size:clamp(28px,3.3vw,40px);line-height:1.05;letter-spacing:-.035em;text-wrap:balance}
.ph .eb,.eb{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--acc);margin-bottom:6px}
.ph .sub{color:var(--muted);margin-top:6px;max-width:640px}
.h2{font-size:22px;font-weight:800;letter-spacing:-.025em;margin-bottom:14px}
.h3{font-size:16.5px;font-weight:800;letter-spacing:-.015em}
.sec{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:28px 0 12px}
.up{text-transform:uppercase;letter-spacing:.16em;font-weight:800}
/* grid & cards */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.side2{grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}
.span2{grid-column:span 2}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h3 a{letter-spacing:.02em;text-transform:none;color:var(--acc);font-size:13px}
.stat small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.stat b{display:block;font-weight:800;font-size:28px;line-height:1.15;margin-top:4px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:15px;color:var(--muted);font-weight:700}
.stat span{font-size:12.5px;color:var(--muted)}
.mini .stat b{font-size:22px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.big small{font-size:15px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.good{color:var(--good)!important}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:8px 14px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 16px -8px var(--acc)}
.btn.pri:hover{filter:brightness(1.07);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.light{background:#fff;color:#0D1917;border-color:#fff}
.btn.light:hover{color:var(--acc)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:10px}
.btn.icon{padding:7px;border-radius:11px}
.btn svg{width:16px;height:16px}
.btn:focus-visible,.in:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

const tsec = s => { const p = String(s).split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : num(s) * 60; };
const mmss = sec => { sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(s); };
const res = (big, lab, more = '') => `<div class="cres"><div class="tiny up muted">${lab}</div><div class="cbig">${big}</div>${more}</div>`;
const CR = {
  bmi: o => { const h = U.l.from(num(o.h)) / 100, w = U.w.from(num(o.w)); if (!h || !w) return ''; const b = w / (h * h); const lo = 18.5 * h * h, hi = 24.9 * h * h; return res(r1(b), 'Your BMI', `<div class="tag">${bmiCat(b)}</div><p class="small muted" style="margin-top:12px">A BMI of 18.5 to 24.9 is the usual healthy range for adults. For your height that is about ${fmt(U.w.to(lo), 1)} to ${fmt(U.w.to(hi), 1)} ${U.w.u()}. BMI does not account for muscle mass.</p><div class="bmiscale"><i style="left:${Math.max(0, Math.min(100, (b - 15) / 25 * 100))}%"></i></div><div class="row between tiny muted"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span></div>`); },
  tdee: o => { const w = U.w.from(num(o.w)), h = U.l.from(num(o.h)); if (!w || !h || !num(o.age)) return ''; const b = bmrCalc(o.sex, w, h, num(o.age)); const t = b * num(o.act); return res(fmt(t), 'Maintenance calories (TDEE)', `<div class="grid g3 mini" style="margin-top:12px"><div class="stat"><small>BMR</small><b>${fmt(b)}</b></div><div class="stat"><small>Lose weight</small><b>${fmt(t - 500)}</b></div><div class="stat"><small>Gain muscle</small><b>${fmt(t + 300)}</b></div></div><p class="small muted" style="margin-top:10px">Mifflin-St Jeor equation. A 500 kcal daily deficit is a common starting point for losing about 0.5 kg (1 lb) a week. Adjust based on your progress.</p><div class="row wrap" style="margin-top:10px"><button type="button" class="btn sm" data-act="useKcal" data-v="${Math.round(t - 500)}">Use ${fmt(t - 500)} as my target</button><button type="button" class="btn sm" data-act="useKcal" data-v="${Math.round(t)}">Use ${fmt(t)}</button><button type="button" class="btn sm" data-act="useKcal" data-v="${Math.round(t + 300)}">Use ${fmt(t + 300)}</button></div>`); },
  macros: o => { const k = num(o.kcal); if (!k) return ''; const [p, c, f] = o.split.split('-').map(Number); const g = [k * p / 400, k * c / 400, k * f / 900].map(Math.round); return res(`${g[0]} / ${g[1]} / ${g[2]} g`, 'Protein / carbs / fat per day', `<div style="margin-top:12px">${donut([{ v: p, c: 'var(--c-p)' }, { v: c, c: 'var(--c-c)' }, { v: f, c: 'var(--c-f)' }], 130, fmt(k), 'kcal')}</div><button type="button" class="btn sm pri" style="margin-top:12px" data-act="useMacros" data-v="${k},${g.join(',')}">Use as my targets</button>`); },
  bodyfat: o => { const h = U.l.from(num(o.h)), n = U.l.from(num(o.neck)), w = U.l.from(num(o.waist)), hp = U.l.from(num(o.hips)); if (!h || !n || !w || (o.sex === 'female' && !hp)) return '<p class="small muted">Fill in every measurement to see your estimate.</p>'; const bf = o.sex === 'male' ? 495 / (1.0324 - .19077 * Math.log10(w - n) + .15456 * Math.log10(h)) - 450 : 495 / (1.29579 - .35004 * Math.log10(w + hp - n) + .221 * Math.log10(h)) - 450; if (!isFinite(bf) || bf <= 0) return '<p class="small muted">Check your measurements.</p>'; return res(r1(bf) + '%', 'Estimated body fat', `<p class="small muted" style="margin-top:10px">US Navy tape method. Measure at the same time of day for the most consistent results.</p><button type="button" class="btn sm" data-act="saveBF" data-v="${r1(bf)}">Save to my body log</button>`); },
  orm: o => { const w = num(o.w), r = num(o.r); if (!w || !r) return '<p class="small muted">Enter a weight and the reps you managed.</p>'; const m = e1rm(w, r); return res(`${fmt(m, 1)} ${U.w.u()}`, 'Estimated one-rep max', `<table class="tbl" style="margin-top:10px"><tbody>${[95, 90, 85, 80, 75, 70, 65, 60].map(pc => `<tr><td>${pc}%</td><td class="num"><b>${fmt(m * pc / 100, 1)} ${U.w.u()}</b></td><td class="tiny muted">${{ 95: '~2 reps', 90: '~3–4 reps', 85: '~5–6 reps', 80: '~8 reps', 75: '~10 reps', 70: '~12 reps', 65: '~15 reps', 60: '~18–20 reps' }[pc]}</td></tr>`).join('')}</tbody></table><p class="tiny muted">Epley formula. Most accurate for sets of 10 reps or fewer.</p>`); },
  water: o => { const w = U.w.from(num(o.w)); if (!w) return ''; const ml = Math.round((w * 35 + num(o.min) / 30 * 350) / 50) * 50; return res(`${fmt(U.v.to(ml))} ${U.v.u()}`, 'Suggested daily water', `<p class="small muted" style="margin-top:10px">A general guide of about 35 ml per kg of body weight, plus about 350 ml for every 30 minutes of exercise. Hot weather and sweat rate change your needs.</p><button type="button" class="btn sm" data-act="useWater" data-v="${ml}">Use as my water goal</button>`); },
  hr: o => { const a = num(o.age); if (!a) return ''; const mx = 220 - a, rhr = num(o.rhr); const z = [[50, 60, 'Zone 1 · Easy', 'Warm-up and recovery'], [60, 70, 'Zone 2 · Endurance', 'Fat burning, long steady sessions'], [70, 80, 'Zone 3 · Aerobic', 'Improves fitness'], [80, 90, 'Zone 4 · Threshold', 'Hard, sustainable for short periods'], [90, 100, 'Zone 5 · Maximum', 'All-out sprints']];
    const bpm = pc => Math.round(rhr ? rhr + (mx - rhr) * pc / 100 : mx * pc / 100); return res(`${mx} bpm`, 'Estimated maximum heart rate', `<table class="tbl" style="margin-top:10px"><tbody>${z.map(([lo, hi, n, d]) => `<tr><td><b>${n}</b><div class="tiny muted">${d}</div></td><td class="num"><b>${bpm(lo)}–${bpm(hi)}</b> bpm</td></tr>`).join('')}</tbody></table><p class="tiny muted">Max heart rate estimated as 220 minus age.${rhr ? ' Zones use the Karvonen method with your resting heart rate.' : ' Add your resting heart rate for more personal zones.'}</p>`); },
  plates: o => { const w = num(o.w), bar = num(o.bar); if (!w || w < bar) return '<p class="small muted">Enter a target heavier than the bar.</p>'; const set = IMP() ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25]; let side = (w - bar) / 2; const out = []; set.forEach(pl => { while (side >= pl - 1e-9) { out.push(pl); side -= pl; } }); const cols = { 25: '#D64545', 20: '#2B6CB0', 15: '#D69E2E', 10: '#2F855A', 5: '#E2E8F0', 2.5: '#4A5568', 1.25: '#A0AEC0', 45: '#2B6CB0', 35: '#D69E2E' };
    return res(`${out.length ? out.join(' + ') : 'Bar only'}`, `Plates on each side (${U.w.u()})`, `<div class="plates">${out.map(pl => `<i style="height:${40 + pl * (IMP() ? 1.6 : 3)}px;background:${cols[pl] || '#718096'}" title="${pl}"></i>`).join('')}<span class="pbar"></span></div>${side > 0.01 ? `<p class="small muted">${fmt(side * 2, 2)} ${U.w.u()} cannot be made with standard plates.</p>` : `<p class="small muted">Total ${fmt(w, 2)} ${U.w.u()} with a ${fmt(bar, 2)} ${U.w.u()} bar.</p>`}`); },
  pace: o => { const d = num(o.d), s = tsec(o.t); if (!d || !s) return ''; return res(`${mmss(s / d)} /${U.d.u()}`, 'Average pace', `<div class="grid g2 mini" style="margin-top:12px"><div class="stat"><small>Speed</small><b>${fmt(d / (s / 3600), 1)} ${U.d.u()}/h</b></div><div class="stat"><small>${IMP() ? 'Per km' : 'Per mile'}</small><b>${mmss(IMP() ? s / d / 1.60934 : s / d * 1.60934)}</b></div></div>`); }
};

  let wmax = 0, run = 0; Object.keys(S.water).sort().forEach((d, i, arr) => { const ok = num(S.water[d]) >= S.settings.water; run = ok ? (i && ymd(addD(pd(arr[i - 1]), 1)) === d && num(S.water[arr[i - 1]]) >= S.settings.water ? run + 1 : 1) : 0; wmax = Math.max(wmax, run); });
  const sleepOk = Object.keys(S.sleep).filter(d => (sleepHrs(S.sleep[d]) || 0) >= S.settings.sleep).length; const fdays = Object.keys(S.meals).filter(d => dayFood(d).n).length; const pdays = Object.keys(S.meals).filter(d => dayFood(d).p >= S.settings.protein).length;
  const hbest = Math.max(0, ...S.habits.map(h => streak(h.id).best)); const wins = S.body.filter(b => num(b.weight)).length; const chd = S.challenges.filter(c => c.done).length; const st10 = Object.values(S.steps).some(v => num(v) >= 10000) ? 1 : 0;

    ['Consistent', 'Train 4 weeks in a row', workoutStreakWeeks(), 4, 'chart'], ['Record breaker', 'Set records on 5 exercises', prs, 5, 'trophy'], ['Heavy lifter', `Lift ${wfmt(10000, 0)} in total`, vol, 10000, 'dumbbell'], ['Iron will', `Lift ${wfmt(100000, 0)} in total`, vol, 100000, 'trophy'],
    ['Hydration hero', 'Hit your water goal 7 days in a row', wmax, 7, 'drop'], ['Well rested', 'Sleep your goal hours on 7 nights', sleepOk, 7, 'moon'], ['Food logger', 'Log your food on 7 days', fdays, 7, 'food'], ['Protein pro', 'Hit your protein target on 5 days', pdays, 5, 'food'],
    ['Habit builder', 'Reach a 7-day habit streak', hbest, 7, 'habit'], ['Habit master', 'Reach a 30-day habit streak', hbest, 30, 'habit'], ['Checking in', 'Log your weight 10 times', wins, 10, 'body'], ['Picture this', 'Add a progress photo', S.photos.length, 1, 'camera'], ['Challenger', 'Complete a challenge', chd, 1, 'flame'], ['Step it up', 'Walk 10,000 steps in a day', st10, 1, 'walk']];

/* ----- fasting ----- */
const PROTOS = [[12, '12:12'], [14, '14:10'], [16, '16:8'], [18, '18:6'], [20, '20:4'], [23, 'OMAD 23:1'], [24, '24 hours']];
const fHrs = f => ((f.end || Date.now()) - f.start) / 36e5;
V.fasting = () => {
  const F = S.fast; const act = F.active; const log = F.log.slice().sort((x, y) => y.start - x.start);
  const done = log.filter(f => fHrs(f) >= f.goal); let stk = 0; for (const f of log) { if (fHrs(f) >= f.goal) stk++; else break; }
  const last14 = log.slice(0, 14).reverse();
  const hrs = act ? fHrs(act) : 0; const goal = act ? act.goal : num(F.goal) || 16;
  return { title: 'Fasting', html: ph('Fuel', 'Fasting tracker', 'Choose a fasting window, start the timer and end it when you eat. For general wellness only, not medical advice.') +
  `<div class="grid side2"><div class="card fastcard"><div class="row" style="gap:30px;flex-wrap:wrap;align-items:center"><div id="fring">${ring(hrs / goal, act ? fmtHM(hrs) : '0:00', act ? `of ${goal} h` : 'not fasting', 200, hrs >= goal ? 'var(--good)' : 'var(--acc)', 16)}</div>
  <div class="grow stack" style="min-width:240px">${act ? `<div><div class="tiny up muted">Started</div><b class="big" style="font-size:22px">${new Date(act.start).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</b></div><div><div class="tiny up muted">Goal reached at</div><b>${new Date(act.start + act.goal * 36e5).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</b></div>
    <div class="row wrap"><button class="btn pri" data-act="endFast">${ic('check')} End fast</button><button class="btn" data-act="editFast">Edit start time</button><button class="btn ghost" data-act="cancelFast">Cancel</button></div>`
  : `<div class="f"><span>Fasting window</span><div class="row wrap">${PROTOS.map(([h, l]) => `<button class="chip ${goal === h ? 'on' : ''}" data-set="fast|goal" data-v="${h}" data-numv>${l}</button>`).join('')}</div></div><div class="row wrap"><button class="btn pri" data-act="startFast">${ic('play')} Start fasting now</button><button class="btn" data-act="logFast">Log a past fast</button></div>`}</div></div>
  <div class="fstages">${[[0, 'Fed'], [4, 'Fasting'], [12, '12 h'], [16, '16 h'], [20, '20 h']].map(([h, l]) => `<div class="${hrs >= h && act ? 'on' : ''}"><i></i><span>${l}</span></div>`).join('')}</div></div>
  <div class="stack" style="gap:16px"><div class="card stat"><small>Streak</small><b>${stk}</b><span>Fasts in a row that hit the goal</span></div><div class="card stat"><small>Completed</small><b>${done.length}<em> / ${log.length}</em></b><span>Fasts that hit the goal</span></div><div class="card stat"><small>Average</small><b>${log.length ? fmtHM(avg(log.map(fHrs))) : '–'}</b><span>Fast length</span></div></div></div>
  <div class="card" style="margin-top:16px"><h3>Last ${last14.length || 14} fasts (hours)</h3>${barChart([last14.map(f => r1(fHrs(f)))], last14.map(f => shortD(ymd(new Date(f.start)))), { h: 180, goal: num(F.goal) || 16, colorFn: (v, i) => v >= last14[i].goal ? 'var(--acc)' : 'color-mix(in srgb,var(--acc) 40%,var(--surf2))' })}</div>
  <div class="card" style="margin-top:16px"><h3>History</h3>${log.length ? `<div class="twrap"><table class="tbl"><thead><tr><th>Started</th><th>Ended</th><th class="num">Length</th><th class="num">Goal</th><th></th><th></th></tr></thead><tbody>${log.slice(0, 40).map(f => { const i = F.log.indexOf(f); const ok = fHrs(f) >= f.goal; return `<tr><td>${new Date(f.start).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</td><td>${new Date(f.end).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</td><td class="num"><b>${fmtHM(fHrs(f))}</b></td><td class="num">${f.goal} h</td><td>${ok ? '<span class="tag good">Goal met</span>' : '<span class="tag">Short</span>'}</td><td><button class="x" data-del="fast|log" data-i="${i}">×</button></td></tr>`; }).join('')}</tbody></table></div>` : empty('No fasts logged yet.')}</div>` };
};
const fmtHM = h => { const m = Math.max(0, Math.round(h * 60)); return `${Math.floor(m / 60)}:${pad(m % 60)}`; };

/* ----- interval timer ----- */
const TPRE = [['tabata', 'Tabata', 20, 10, 8], ['hiit', 'HIIT 40/20', 40, 20, 10], ['emom', 'EMOM', 50, 10, 10], ['long', 'Long intervals', 60, 30, 8], ['custom', 'Custom', 30, 15, 8]];
const TM = { on: false, phase: 'ready', round: 1, left: 0, last: 0, run: false };
V.timer = () => {
  const t = S.timerCfg; const exs = (t.ex || ['burpee', 'squat', 'pushup', 'mountain']).map(exById);
  return { title: 'Interval timer', html: ph('Train', 'Interval timer', 'Tabata, HIIT or your own intervals. The character shows each move and a beep tells you when to switch.') +
  `<div class="grid timerg"><div class="card tcard2"><div class="tphase" id="tphase">Ready</div><div class="tbig" id="tbig">${mmss(t.work)}</div><div class="tiny up muted" id="tround">Round 1 of ${t.rounds}</div>
  <div class="tfig" id="tfigw">${fig(exs[0].id, 'big', true)}</div><div class="tiny muted" id="tex">${esc(exs[0].n)}</div><div class="bar" style="margin:12px 0"><i id="tbar" style="width:0%"></i></div>
  <div class="row wrap" style="justify-content:center"><button class="btn pri" data-act="tStart" id="tgo">${ic('play')} Start</button><button class="btn" data-act="tPause">Pause</button><button class="btn" data-act="tReset">Reset</button></div></div>

  <div class="grid g3" style="gap:10px;margin-top:14px"><label class="f"><span>Work (s)</span>${bin('timerCfg|work', '', 'text', '', 'inputmode="numeric"')}</label><label class="f"><span>Rest (s)</span>${bin('timerCfg|rest', '', 'text', '', 'inputmode="numeric"')}</label><label class="f"><span>Rounds</span>${bin('timerCfg|rounds', '', 'text', '', 'inputmode="numeric"')}</label></div>
  <div class="tiny muted" style="margin-top:8px">Total about ${Math.round((num(t.work) + num(t.rest)) * num(t.rounds) / 60)} min</div></div>
  <div class="card"><h3>Moves <span class="tiny muted">rotate each round</span></h3>${exs.map((e, i) => `<div class="hrow">${fig(e.id, 'xs')}<span class="grow"><b class="small">${esc(e.n)}</b></span><button class="x" data-act="tDelEx" data-i="${i}">×</button></div>`).join('')}<button class="btn sm" style="margin-top:10px" data-act="tAddEx">${ic('plus')} Add move</button></div>
  <div class="card stack"><h3>Log it</h3><div class="small muted">Save this session to your workout history when you finish.</div><button class="btn" data-act="tSave">${ic('check')} Save as workout</button></div></div></div>` };
};
function tCfg() { const t = S.timerCfg; return { w: Math.max(5, num(t.work)), r: Math.max(0, num(t.rest)), n: Math.max(1, num(t.rounds)), ex: t.ex && t.ex.length ? t.ex : ['burpee'] }; }
function tTick(now) {
  if (!TM.on) return; const el = $('#tbig'); if (!el) { TM.on = false; return; }
  const c = tCfg(); if (TM.run) { TM.left -= (now - TM.last) / 1000; } TM.last = now;
  if (TM.run && TM.left <= 0) { if (TM.phase === 'work') { if (TM.round >= c.n) { TM.phase = 'done'; TM.run = false; beep(); beep(); toast('Interval session complete!'); } else if (c.r > 0) { TM.phase = 'rest'; TM.left = c.r; beep(); } else { TM.round++; TM.left = c.w; beep(); } } else if (TM.phase === 'rest') { TM.phase = 'work'; TM.round++; TM.left = c.w; beep(); } }
  if (TM.run && TM.left <= 3.05 && TM.left > 2.95 && TM.phase !== 'done') { /* countdown tick */ }
  const ex = exById(c.ex[(TM.round - 1) % c.ex.length]);
  el.textContent = TM.phase === 'done' ? 'Done' : mmss(Math.max(0, TM.left));
  const phE = $('#tphase'); phE.textContent = { ready: 'Ready', work: 'Work', rest: 'Rest', done: 'Complete' }[TM.phase]; phE.className = 'tphase ' + TM.phase;
  $('#tround').textContent = `Round ${Math.min(TM.round, c.n)} of ${c.n}`; $('#tex').textContent = TM.phase === 'rest' ? `Next: ${exById(c.ex[TM.round % c.ex.length]).n}` : ex.n;
  const f = $('#tfigw .fig'); if (f && f.dataset.ex !== ex.id) { const a = exAnim(ex.id); f.dataset.pat = a.p; f.dataset.prop = a.prop; f.dataset.ex = ex.id; }
  if (f) { if (TM.phase === 'work' && TM.run) f.classList.add('live'); else f.classList.remove('live'); }
  const tot = TM.phase === 'rest' ? c.r : c.w; $('#tbar').style.width = (TM.phase === 'done' ? 100 : (1 - Math.max(0, TM.left) / tot) * 100) + '%';
  $('#tbar').style.background = TM.phase === 'rest' ? 'var(--good)' : 'var(--acc)';
  requestAnimationFrame(tTick);
}

/* ----- training calendar ----- */
function trainCal(mStr) {
  const base = mStr && /^\d{4}-\d\d$/.test(mStr) ? new Date(+mStr.slice(0, 4), +mStr.slice(5) - 1, 1) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const s = weekStartOf(base); const cells = []; for (let i = 0; i < 42; i++) { const d = addD(s, i); cells.push(d); if (i % 7 === 6 && (d.getMonth() !== base.getMonth() && i > 27)) break; }
  const prev = new Date(base.getFullYear(), base.getMonth() - 1, 1), next = new Date(base.getFullYear(), base.getMonth() + 1, 1); const mk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const t = today(); const mDays = cells.filter(d => d.getMonth() === base.getMonth()).map(ymd); const nW = mDays.filter(d => sessionsOn(d).length).length; const mins = sum(mDays.flatMap(d => sessionsOn(d).map(x => num(x.dur))));
  return `<div class="row between wrap" style="margin-bottom:14px"><div class="row"><a class="btn icon" href="#/workouts/calendar/${mk(prev)}" aria-label="Previous month">${ic('left')}</a><b class="h3" style="min-width:150px;text-align:center">${MONTHS[base.getMonth()]} ${base.getFullYear()}</b><a class="btn icon" href="#/workouts/calendar/${mk(next)}" aria-label="Next month">${ic('right')}</a></div><div class="row wrap"><span class="chip">${nW} training days</span><span class="chip">${fmt(mins)} minutes</span></div></div>
  <div class="card tcal"><div class="tcg">${[...Array(7)].map((_, i) => `<div class="tch">${DOWS[(i + S.settings.weekStart) % 7]}</div>`).join('')}${cells.map(d => { const ds = ymd(d); const ss = sessionsOn(ds); const p = planFor(ds); const out = d.getMonth() !== base.getMonth(); const fut = ds > t;
    return `<div class="tcc ${out ? 'out' : ''} ${ds === t ? 'today' : ''}"><span class="n">${d.getDate()}</span>${ss.map(x => { const r = byId(S.routines, x.routine); return `<a class="tev" href="#/session/${x.id}" style="--rc:${r ? r.color : 'var(--acc)'}">${esc(x.name)}<small>${fmt(num(x.dur))} min</small></a>`; }).join('')}${!ss.length && fut && p && p !== 'rest' ? `<span class="tev plan" style="--rc:${p.color}">${esc(p.name)}</span>` : ''}${!ss.length && p === 'rest' && !out ? '<span class="tiny muted">Rest</span>' : ''}</div>`; }).join('')}</div></div>
  <div class="tiny muted" style="margin-top:8px">Solid blocks are completed workouts. Outlined blocks are planned from your weekly plan.</div>`;
}

/* ----- weekly review ----- */

function upsertBody(date, vals) { let e = S.body.find(b => b.date === date); if (!e) { e = { id: uid(), date }; S.body.push(e); } Object.assign(e, vals); save(); render(); }
function dl(name, text, type) { const b = new Blob([text], { type }); const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = name; document.body.appendChild(l); l.click(); setTimeout(() => { URL.revokeObjectURL(u); l.remove(); }, 800); }
function restore(file) { const fr = new FileReader(); fr.onload = async () => { try { const o = JSON.parse(fr.result); if (!o.state || o.app !== 'strive') throw 0; if (!confirm('Restore this backup? It replaces your current planner.')) return; merge(o.state); for (const [k, d] of Object.entries(o.images || {})) await IMG.put(k, d); save(); applyTheme(); render(); toast('Backup restored'); } catch (e) { toast('That file is not a Strive backup'); } }; fr.readAsText(file); }
